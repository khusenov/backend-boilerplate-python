[project]
name = "backend-boilerplate"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "limits>=5.8.0",
    "procrastinate==3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sentry-sdk==2.73.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "starlette>=1.9.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend-boilerplate = "app.cli:cli"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff==0.17.2",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.7"

[tool.uv.build-backend]
module-name = "app"

[tool.alembic]
script_location = "%(here)s/migrations"

[[tool.alembic.post_write_hooks]]
name = "ruff_imports"
type = "module"
module = "ruff"
options = "check --select I,F401 --fix --quiet REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format --quiet REVISION_SCRIPT_FILENAME"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "C90", "RUF", "ASYNC", "S", "BLE",
    "TRY", "PT", "DTZ", "TID", "FAST", "T20", "PLE", "PLW", "FURB", "ERA", "FIX", "INP",
    "PGH", "G",
]
ignore = ["TRY003", "TRY004"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["INP"]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read settings through app.core.config.Settings."
"os.environb".msg = "Read settings through app.core.config.Settings."
"os.getenv".msg = "Read settings through app.core.config.Settings."
"os.getenvb".msg = "Read settings through app.core.config.Settings."
"fastapi.BackgroundTasks".msg = "Defer a job with app.core.jobs.queue.JobQueue instead."
"fastapi.background".msg = "Defer a job with app.core.jobs.queue.JobQueue instead."
"starlette.background".msg = "Defer a job with app.core.jobs.queue.JobQueue instead."
"asyncio.create_task".msg = "Defer a job with app.core.jobs.queue.JobQueue, or use asyncio.TaskGroup."
"asyncio.tasks.create_task".msg = "Defer a job with app.core.jobs.queue.JobQueue, or use asyncio.TaskGroup."
"asyncio.ensure_future".msg = "Defer a job with app.core.jobs.queue.JobQueue, or use asyncio.TaskGroup."
"asyncio.tasks.ensure_future".msg = "Defer a job with app.core.jobs.queue.JobQueue, or use asyncio.TaskGroup."
"src".msg = "Import app, not src.app."
"typing.no_type_check".msg = "Silence one line with # pyright: ignore[rule]."
"typing_extensions.no_type_check".msg = "Silence one line with # pyright: ignore[rule]."

[tool.basedpyright]
typeCheckingMode = "standard"
strict = ["src"]
enableTypeIgnoreComments = false
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
failOnWarnings = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Entrypoint chain"
type = "layers"
containers = ["app"]
layers = ["main | (worker) | (cli)", "(bootstrap)", "modules", "core"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "HTTP stays in routers and core.http"
type = "forbidden"
source_modules = ["app.core.*", "app.modules"]
forbidden_modules = ["fastapi", "starlette", "app.core.http"]
allow_indirect_imports = true
ignore_imports = [
    "app.core.http.** -> fastapi",
    "app.core.http.** -> starlette",
    "app.modules.*.router -> fastapi",
    "app.modules.*.router -> app.core.http.**",
]

[[tool.importlinter.contracts]]
name = "Procrastinate stays in core.jobs and tasks"
type = "forbidden"
source_modules = ["app.core.*", "app.modules"]
forbidden_modules = ["procrastinate"]
allow_indirect_imports = true
ignore_imports = [
    "app.core.jobs.** -> procrastinate",
    "app.modules.*.tasks -> procrastinate",
]

[[tool.importlinter.contracts]]
name = "Modules meet only through public.py"
type = "independence"
modules = ["app.modules.*"]
ignore_imports = ["app.modules.** -> app.modules.*.public"]

[[tool.importlinter.contracts]]
name = "Inside a module"
type = "layers"
containers = ["app.modules.*"]
layers = [
    "(router) | (tasks) | (public)",
    "service",
    "(queries) | (domain)",
    "(schemas) : (models) : (errors)",
]

[[tool.importlinter.contracts]]
name = "Modules are acyclic"
type = "acyclic_siblings"
ancestors = ["app.modules"]
depth = 0

[[tool.importlinter.contracts]]
name = "Routers leave queries to services"
type = "forbidden"
source_modules = ["app.modules.*.router"]
forbidden_modules = ["sqlalchemy", "app.modules.*.models"]
allow_indirect_imports = true

[tool.pytest]
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]
markers = ["committed: commits for real, then truncates every table but alembic_version"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
branch = true
source = ["app"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 90
precision = 2
exclude_lines = []
partial_branches = []
show_missing = true
skip_covered = true
