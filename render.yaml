databases:
  - name: backend-boilerplate-staging-db
    plan: basic-256mb
    postgresMajorVersion: "18"
    region: oregon
    ipAllowList: []

envVarGroups:
  - name: backend-boilerplate-staging
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://staging.khusenov.com
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: staging

services:
  - type: worker
    name: backend-boilerplate-staging-worker
    runtime: image
    image:
      url: ghcr.io/khusenov/backend-boilerplate-python:main
    plan: starter
    region: oregon
    dockerCommand: python -m app.worker
    # Render hands everything after "sh -c" to the shell verbatim, so quotes would become part of the script.
    preDeployCommand: sh -c alembic -x ahead=skip upgrade head && alembic -x ahead=skip check
    maxShutdownDelaySeconds: 45
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: backend-boilerplate-staging-db
          property: connectionString
      - fromGroup: backend-boilerplate-staging

  - type: web
    name: backend-boilerplate-staging-api
    runtime: image
    image:
      url: ghcr.io/khusenov/backend-boilerplate-python:main
    plan: starter
    region: oregon
    healthCheckPath: /health/live
    maxShutdownDelaySeconds: 45
    domains:
      - api.staging.khusenov.com
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: backend-boilerplate-staging-db
          property: connectionString
      - fromGroup: backend-boilerplate-staging
