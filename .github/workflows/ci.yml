name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make check

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose

  osv-scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan source --lockfile=/src/uv.lock

  smoke:
    needs: [check, gitleaks, osv-scanner]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make smoke
      - if: github.ref == 'refs/heads/main'
        run: docker save --output image.tar backend-boilerplate
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: docker load --input image.tar
      - id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag backend-boilerplate "$image:$GITHUB_SHA"
          docker tag backend-boilerplate "$image:main"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$image"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$GITHUB_SHA")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - run: |
          curl --fail --silent --show-error --location --output render.zip https://github.com/render-oss/cli/releases/download/v2.29.0/cli_2.29.0_linux_amd64.zip
          echo "fd8b6e73390cf26b80c5def38a4d6ba9d64de6c5e7b37a9f28b7eb46ae0b4ead  render.zip" | sha256sum --check
          unzip -q render.zip cli_v2.29.0
          sudo install cli_v2.29.0 /usr/local/bin/render
      - env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          IMAGE: ${{ steps.push.outputs.ref }}
        run: render deploys create "$RENDER_SERVICE_ID" --image "$IMAGE" --wait --confirm --output text
